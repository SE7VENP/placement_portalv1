{% extends 'basic.html' %}
{% block title %}Edit Profile - Placement Portal{% endblock %}
{% block body %}
{% load static %}
	<!-- banner -->
	<div class="banner-agile-2">
		<!-- navigation -->

		<!-- //navigation -->
	</div>

	<!-- breadcrumb -->
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item">
				<a href="/">Home</a>
			</li>
			<li class="breadcrumb-item active" aria-current="page">Edit Profile</li>
		</ol>
	</nav>
	<!-- breadcrumb -->
	<!-- //banner -->
{% include 'messages.html' %}
	<!-- register -->
	<div class="login-w3ls py-5">
		<div class="container py-xl-5 py-lg-3">
			<h3 class="title text-capitalize font-weight-light text-dark text-center mb-5">Edit Profile
			</h3>
			<!-- content -->
			<div class="sub-main-w3 pt-md-4">
				<form action="/editprofilecompsubmit" method="post" enctype="multipart/form-data">{% csrf_token %}

					<div class="form-style-agile form-group">
						<label>
							Company Name
							<i class="fas fa-user"></i>
						</label>
						<input placeholder="{{companydata.company_name}}" value="{{companydata.company_name}}" class="form-control" name="name" type="text" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Email
							<i class="fas fa-envelope"></i>
						</label>
						<input placeholder="{{companydata.l_id.email_id}}" value="{{companydata.l_id.email_id}}" class="form-control" name="email" type="email" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Your Phone
							<i class="fas fa-phone"></i>
						</label>
						<input placeholder="{{companydata.l_id.phone_no}}" value="{{companydata.l_id.phone_no}}" class="form-control" name="phone" type="tel" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company Type

						</label>
						<input placeholder="{{companydata.company_type}}" value="{{companydata.company_type}}" class="form-control" name="type" type="text" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company Address

						</label>
						<input placeholder="{{companydata.company_address}}" value="{{companydata.company_address}}" class="form-control" name="address" type="text" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company Website

						</label>
						<input placeholder="{{companydata.company_webiste}}" value="{{companydata.company_webiste}}" class="form-control" name="website" type="url" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Founded in Year

						</label>
						<input placeholder="{{companydata.founded_year}}" value="{{companydata.founded_year}}" class="form-control" name="fyear" id="fyear" type="number" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company Support Mail

						</label>
						<input placeholder="{{companydata.company_support_mail}}" value="{{companydata.company_support_mail}}" class="form-control" name="smail" type="email" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company Support Phone

						</label>
						<input placeholder="{{companydata.company_support_phone}}" value="{{companydata.company_support_phone}}" class="form-control" name="sphone" type="tel" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company Size

						</label>
						<input placeholder="{{companydata.company_size}}" value="{{companydata.company_size}}" class="form-control" name="csize" id="csize" type="number" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company Area

						</label>
						<input placeholder="{{companydata.company_area}}" value="{{companydata.company_area}}" class="form-control" name="area" type="text" required="">
					</div>
					<div class="form-style-agile form-group">
						<label>
							Company City

						</label>
						<input placeholder="{{companydata.company_city}}" value="{{companydata.company_city}}" class="form-control" name="city" type="text" required="">
					</div>

					<input type="submit" value="Submit">
				</form>
			</div>
			<!-- //content -->
		</div>
	</div>
	<!-- //register -->

	<!-- brands -->
	<div class="brands-w3ls py-md-5 py-4">
		<div class="container py-xl-3">
			<ul class="list-unstyled">
				<li>
					<i class="fab fa-supple"></i>
				</li>
				<li>
					<i class="fab fa-angrycreative"></i>
				</li>
				<li>
					<i class="fab fa-aviato"></i>
				</li>
				<li>
					<i class="fab fa-aws"></i>
				</li>
				<li>
					<i class="fab fa-cpanel"></i>
				</li>
				<li>
					<i class="fab fa-hooli"></i>
				</li>
				<li>
					<i class="fab fa-node"></i>
				</li>
			</ul>
		</div>
	</div>
	<!-- //brands -->




	<!-- Js files -->
	<!-- JavaScript -->
	<script src=" {% static 'js/jquery-2.2.3.min.js' %} "></script>
	<!-- Default-JavaScript-File -->
	<script src=" {% static 'js/bootstrap.js' %} "></script>
	<!-- Necessary-JavaScript-File-For-Bootstrap -->

	<!-- password-script -->
	<script>
		window.onload = function () {
			document.getElementById("password1").onchange = validatePassword;
			document.getElementById("password2").onchange = validatePassword;
		}

		function validatePassword() {
			var pass2 = document.getElementById("password2").value;
			var pass1 = document.getElementById("password1").value;
			if (pass1 != pass2)
				document.getElementById("password2").setCustomValidity("Passwords Don't Match");
			else
				document.getElementById("password2").setCustomValidity('');
			//empty string means no validation error
		}
	</script>
	<!-- //password-script -->

	<!-- smooth scrolling -->
	<script src=" {% static 'js/SmoothScroll.min.js' %} "></script>
	<!-- //smooth scrolling -->

	<!-- move-top -->
	<script src=" {% static 'js/move-top.js' %} "></script>
	<!-- easing -->
	<script src=" {% static 'js/easing.js' %} "></script>
	<!--  necessary snippets for few javascript files -->
	<script src=" {% static 'js/edulearn.js' %} "></script>
	<script src=" {% static 'js/responsive.js' %} "></script>
	<!-- //Js files -->


{% endblock %}
